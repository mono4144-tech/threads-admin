<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>쓰레드 관리</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1c1a;--sub:#6d6a63;--line:#e3e0d9;--accent:#2f5d50;--accent-ink:#fff;--warn:#b4541a;--bad:#b3261e;--ok:#2f6b3f;--chip:#ece9e2}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#201f1d;--ink:#eceae4;--sub:#a09c93;--line:#34322e;--accent:#7fc0ab;--accent-ink:#10231d;--warn:#e0965c;--bad:#f08a80;--ok:#8fcf9d;--chip:#2b2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:19px;margin:0;flex:1}
h2{font-size:16px;margin:22px 0 8px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.tabs{display:flex;gap:6px;margin:8px 0 14px}
.tabs button{flex:1}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--chip);border-color:transparent;border-radius:99px;padding:4px 12px;font-size:13px}
.chips button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.meta b{color:var(--ink);font-size:15px}
.badge{border-radius:99px;padding:1px 9px;font-size:12px;background:var(--chip)}
.badge.posted{color:var(--ok)}.badge.failed,.badge.missed{color:var(--bad)}.badge.skipped{color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row.two>*{flex:1;min-width:140px}
.count{font-size:12px;color:var(--sub);text-align:right}.count.over{color:var(--bad)}
.note{font-size:13px;color:var(--sub)}
.err{color:var(--bad);font-size:13px;margin-top:6px;word-break:break-all}
.body{white-space:pre-wrap;margin:8px 0 0}
.reply{border-left:3px solid var(--line);padding-left:10px;margin-top:10px}
.guide{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.guide code{background:var(--card);padding:1px 6px;border-radius:5px;user-select:all}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;display:none;max-width:90vw}
a{color:var(--accent)}
.slot{display:flex;gap:6px;margin-top:6px}.slot select{width:96px;flex:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script>
const OWNER = 'mono4144-tech', REPO = 'threads-auto', WORKFLOW = 'threads.yml';
const S = { token: '', cfg: null, cfgSha: '', queue: [], tab: 'queue', filter: 'all', editing: null, lastRun: null };
try { S.token = localStorage.getItem('gh_token') || ''; } catch (e) {}

// ───── 도우미 ─────
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 3500); }
const kstNow = () => new Date(Date.now() + 9 * 3600e3);
const today = () => kstNow().toISOString().slice(0, 10);
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const b64e = s => { const b = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(o); };
const accName = id => (S.cfg.accounts.find(a => a.id === id) || {}).name || id;
const dayLabel = d => { const t = today(); const tm = new Date(Date.now() + 33 * 3600e3).toISOString().slice(0, 10); return d === t ? '오늘' : d === tm ? '내일' : d.slice(5).replace('-', '/'); };
const STATUS = { scheduled: '예정', skipped: '건너뜀', posted: '올라감', failed: '실패', missed: '시간 지남' };

// ───── GitHub ─────
async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, { ...opt, cache: 'no-store', headers: { Authorization: 'Bearer ' + S.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
async function readFile(p) { const j = await gh(`/repos/${OWNER}/${REPO}/contents/${p}?ref=main&t=${Date.now()}`); return { data: JSON.parse(b64d(j.content)), sha: j.sha }; }
async function writeFile(p, data, sha, message) { return gh(`/repos/${OWNER}/${REPO}/contents/${p}`, { method: 'PUT', body: JSON.stringify({ message, sha, branch: 'main', content: b64e(JSON.stringify(data, null, 1) + '\n') }) }); }
async function mutateQueue(fn, message) {
  for (let i = 0; i < 4; i++) {
    const f = await readFile('queue.json'); fn(f.data);
    try { await writeFile('queue.json', f.data, f.sha, message); S.queue = f.data; return; }
    catch (e) { if (e.status !== 409 && e.status !== 422) throw e; }
  }
  throw new Error('저장이 겹쳤어요. 잠시 후 다시 시도해 주세요.');
}
async function saveConfig(cfg, message) { const f = await readFile('config.json'); await writeFile('config.json', cfg, f.sha, message); S.cfg = cfg; }
async function runNow() { await gh(`/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, { method: 'POST', body: JSON.stringify({ ref: 'main' }) }); }
async function loadAll() {
  const [c, q] = await Promise.all([readFile('config.json'), readFile('queue.json')]);
  S.cfg = c.data; S.queue = q.data;
  try { const r = await gh(`/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=1`); S.lastRun = r.workflow_runs[0] || null; } catch (e) { S.lastRun = null; }
}
async function act(fn, okMsg) { try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(e.status === 401 ? '토큰이 만료됐거나 잘못됐어요' : (e.message || '오류가 났어요')); } render(); }

// ───── 화면 ─────
function render() {
  const app = document.getElementById('app'); app.replaceChildren();
  if (!S.token || !S.cfg) return app.append(loginView());
  const run = S.lastRun;
  app.append(
    h('header', {}, h('h1', {}, '쓰레드 관리'),
      h('button', { onclick: () => act(loadAll, '새로 불러왔어요') }, '새로고침'),
      h('button', { onclick: () => act(runNow, '실행을 시작했어요. 1~2분 뒤 새로고침하세요') }, '지금 실행')),
    h('div', { class: 'note' }, run ? `마지막 실행: ${new Date(run.created_at).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })} · ${run.status !== 'completed' ? '진행 중' : run.conclusion === 'success' ? '정상' : '오류'}` : ''),
    h('div', { class: 'tabs' }, [['queue', '예정 글'], ['log', '기록'], ['accounts', '계정']].map(([k, label]) =>
      h('button', { class: S.tab === k ? 'on' : '', onclick: () => { S.tab = k; S.editing = null; render(); } }, label))),
    S.tab === 'queue' ? queueView() : S.tab === 'log' ? logView() : accountsView());
}

function loginView() {
  const input = h('input', { type: 'password', placeholder: 'github_pat_…', autocomplete: 'off' });
  const go = () => { S.token = input.value.trim(); act(async () => { try { await loadAll(); localStorage.setItem('gh_token', S.token); } catch (e) { S.token = ''; S.cfg = null; throw new Error(e.status === 401 ? '토큰이 올바르지 않아요' : '저장소를 읽지 못했어요. 토큰 권한을 확인해 주세요'); } }); };
  return h('div', { class: 'card' }, h('h1', {}, '쓰레드 관리'),
    h('p', { class: 'note' }, `처음 한 번만 GitHub 접근 토큰을 넣어 주세요. 토큰은 이 브라우저에만 저장되고 GitHub 외에는 어디로도 보내지 않아요.`),
    h('label', {}, 'GitHub 토큰'), input, h('div', { class: 'row' }, h('button', { class: 'primary', onclick: go }, '연결')));
}

function filterChips() {
  return h('div', { class: 'chips' }, [['all', '전체'], ...S.cfg.accounts.map(a => [a.id, a.name])].map(([id, label]) =>
    h('button', { class: S.filter === id ? 'on' : '', onclick: () => { S.filter = id; render(); } }, label)));
}
const visible = it => S.filter === 'all' || it.account === S.filter;

function counter(ta) { const c = h('div', { class: 'count' }); const up = () => { c.textContent = ta.value.length + ' / 500'; c.className = 'count' + (ta.value.length > 500 ? ' over' : ''); }; ta.addEventListener('input', up); up(); return c; }

function queueView() {
  const items = S.queue.filter(it => (it.status === 'scheduled' || it.status === 'skipped') && it.date >= today() && visible(it));
  const box = h('div', {}, filterChips());
  if (!items.length) box.append(h('div', { class: 'card note' }, '예정된 글이 없어요. 매시간 자동으로 오늘·내일 글을 만들어 둬요. 바로 만들려면 위의 "지금 실행"을 누르세요.'));
  let last = '';
  for (const it of items) {
    if (it.date !== last) { box.append(h('h2', {}, `${dayLabel(it.date)} (${it.date})`)); last = it.date; }
    box.append(queueCard(it));
  }
  return box;
}

function queueCard(it) {
  const title = h('input', { value: it.title || '' }), tag = h('input', { value: it.topic_tag || '' });
  const main = h('textarea', { rows: 9 }); main.value = it.main || '';
  const repliesBox = h('div', {}); const replyAreas = [];
  const addReply = text => { const ta = h('textarea', { rows: 6 }); ta.value = text; replyAreas.push(ta);
    const wrap = h('div', { class: 'reply' }, h('label', {}, '이어지는 글'), ta, counter(ta), h('button', { onclick: () => { replyAreas.splice(replyAreas.indexOf(ta), 1); wrap.remove(); } }, '이 글 빼기')); repliesBox.append(wrap); };
  (it.replies || []).forEach(addReply);
  const collect = () => ({ title: title.value.trim(), topic_tag: tag.value.replace(/#/g, '').trim(), main: main.value.trim(), replies: replyAreas.map(t => t.value.trim()).filter(Boolean) });
  const change = (fields, msg) => act(() => mutateQueue(q => { const x = q.find(i => i.id === it.id); if (!x) throw new Error('이미 처리된 글이에요. 새로고침해 주세요'); if (x.status === 'posted') throw new Error('이미 올라간 글이에요'); Object.assign(x, fields); }, '관리 화면: ' + it.id), msg);
  const save = () => { const f = collect(); if (!f.main) return toast('첫 글이 비어 있어요'); if ([f.main, ...f.replies].some(t => t.length > 500)) return toast('500자를 넘는 글이 있어요'); change(f, '저장했어요'); };
  const skipped = it.status === 'skipped';
  return h('div', { class: 'card' },
    h('div', { class: 'meta' }, h('b', {}, it.time), accName(it.account), h('span', { class: 'badge ' + it.status }, STATUS[it.status]), it.regenerate ? h('span', { class: 'badge' }, '다시 만드는 중') : null),
    it.error ? h('div', { class: 'err' }, it.error) : null,
    h('div', { class: 'row two' }, h('div', {}, h('label', {}, '주제'), title), h('div', {}, h('label', {}, '주제 태그'), tag)),
    h('label', {}, '첫 글'), main, counter(main), repliesBox,
    h('div', { class: 'row' },
      h('button', { class: 'primary', onclick: save }, '저장'),
      h('button', { onclick: () => replyAreas.length >= 3 ? toast('이어지는 글은 3개까지예요') : addReply('') }, '+ 이어지는 글'),
      h('button', { onclick: () => act(async () => { await mutateQueue(q => { const x = q.find(i => i.id === it.id); if (x) x.regenerate = true; }, '다시 만들기: ' + it.id); await runNow(); }, '다시 만들고 있어요. 1~2분 뒤 새로고침하세요') }, '다시 만들기'),
      h('button', { class: skipped ? '' : 'danger', onclick: () => change({ status: skipped ? 'scheduled' : 'skipped' }, skipped ? '다시 올리기로 했어요' : '이 글은 올리지 않아요') }, skipped ? '되살리기' : '건너뛰기')));
}

function logView() {
  const items = S.queue.filter(it => ['posted', 'failed', 'missed'].includes(it.status) && visible(it)).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  const box = h('div', {}, filterChips());
  if (!items.length) box.append(h('div', { class: 'card note' }, '아직 기록이 없어요.'));
  for (const it of items) box.append(h('div', { class: 'card' },
    h('div', { class: 'meta' }, h('b', {}, `${it.date.slice(5).replace('-', '/')} ${it.time}`), accName(it.account), h('span', { class: 'badge ' + it.status }, STATUS[it.status]), it.permalink ? h('a', { href: it.permalink, target: '_blank', rel: 'noopener' }, '쓰레드에서 보기') : null),
    h('div', { class: 'note' }, it.title || ''), it.error ? h('div', { class: 'err' }, it.error) : null,
    h('details', {}, h('summary', { class: 'note' }, '글 보기'), h('p', { class: 'body' }, it.main), (it.replies || []).map(r => h('p', { class: 'body reply' }, r)))));
  return box;
}

function accountsView() {
  if (S.editing) return accountForm(S.editing);
  const box = h('div', {});
  for (const a of S.cfg.accounts) box.append(h('div', { class: 'card' },
    h('div', { class: 'meta' }, h('b', {}, a.name), '@' + a.username, h('span', { class: 'badge ' + (a.enabled ? 'posted' : 'skipped') }, a.enabled ? '사용 중' : '꺼짐')),
    h('div', { class: 'note' }, '올리는 시간: ' + (a.slots || []).map(s => s.time).join(', ')),
    h('div', { class: 'row' }, h('button', { onclick: () => { S.editing = JSON.parse(JSON.stringify(a)); render(); } }, '설정'))));
  box.append(h('button', { class: 'primary', onclick: () => { S.editing = { isNew: true, id: '', name: '', username: '', enabled: false, token_secret: '', persona: '', cta_start: '', cta_hint: "프로필 링크로 자연스럽게 안내한다 (URL은 쓰지 말고 '프로필 링크'라고만).", slots: [{ time: '09:00', hint: '' }, { time: '14:00', hint: '' }, { time: '20:00', hint: '' }] }; render(); } }, '+ 계정 추가'));
  return box;
}

function accountForm(a) {
  const hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0') + ':00');
  const name = h('input', { value: a.name, placeholder: '예: 지안' }), user = h('input', { value: a.username, placeholder: '예: mindreader_jian', disabled: !a.isNew });
  const enabled = h('input', { type: 'checkbox', style: 'width:auto' }); enabled.checked = !!a.enabled;
  const persona = h('textarea', { rows: 8, placeholder: '어떤 사람이 어떤 말투로 어떤 주제를 쓰는지 적어 주세요' }); persona.value = a.persona || '';
  const ctaStart = h('input', { type: 'date', value: a.cta_start || '' }); const ctaHint = h('textarea', { rows: 3 }); ctaHint.value = a.cta_hint || '';
  const slotsBox = h('div', {}); const slotEls = [];
  const addSlot = s => { const sel = h('select', {}, hours.map(t => h('option', { value: t, selected: t === s.time }, t))); const hint = h('input', { value: s.hint || '', placeholder: '이 시간 글의 주제 방향' });
    const entry = { sel, hint }; slotEls.push(entry);
    const row = h('div', { class: 'slot' }, sel, hint, h('button', { onclick: () => { slotEls.splice(slotEls.indexOf(entry), 1); row.remove(); } }, '삭제')); slotsBox.append(row); };
  (a.slots || []).forEach(addSlot);
  const secretOf = () => a.token_secret || ('THREADS_TOKEN_' + user.value.trim().replace(/^@/, '').replace(/[^A-Za-z0-9]/g, '_').toUpperCase());
  const secretCode = h('code', {}, secretOf()); user.addEventListener('input', () => secretCode.textContent = secretOf());
  const save = () => {
    const id = a.isNew ? user.value.trim().replace(/^@/, '').toLowerCase() : a.id;
    if (!name.value.trim() || !id) return toast('이름과 쓰레드 아이디를 적어 주세요');
    if (!/^[a-z0-9._]+$/.test(id)) return toast('쓰레드 아이디는 영문·숫자·밑줄·마침표만 가능해요');
    if (a.isNew && S.cfg.accounts.some(x => x.id === id)) return toast('이미 있는 계정이에요');
    if (!persona.value.trim()) return toast('말투·주제 설정을 적어 주세요');
    const slots = slotEls.map(s => ({ time: s.sel.value, hint: s.hint.value.trim() })).sort((x, y) => x.time.localeCompare(y.time));
    if (!slots.length) return toast('올리는 시간을 하나 이상 넣어 주세요');
    if (new Set(slots.map(s => s.time)).size !== slots.length) return toast('같은 시간이 두 번 들어 있어요');
    const acc = { id, name: name.value.trim(), username: id, enabled: enabled.checked, token_secret: secretOf(), persona: persona.value.trim(), cta_start: ctaStart.value, cta_hint: ctaHint.value.trim(), slots };
    const cfg = JSON.parse(JSON.stringify(S.cfg)); const i = cfg.accounts.findIndex(x => x.id === id); if (i >= 0) cfg.accounts[i] = acc; else cfg.accounts.push(acc);
    act(async () => { await saveConfig(cfg, '계정 설정: ' + id); S.editing = null; }, '저장했어요. 다음 실행부터 반영돼요');
  };
  const remove = () => { if (!confirm(`${a.name} 계정을 목록에서 지울까요? 올라간 글은 그대로 남아요.`)) return; const cfg = JSON.parse(JSON.stringify(S.cfg)); cfg.accounts = cfg.accounts.filter(x => x.id !== a.id); act(async () => { await saveConfig(cfg, '계정 삭제: ' + a.id); S.editing = null; }, '지웠어요'); };
  return h('div', { class: 'card' }, h('h2', { style: 'margin-top:0' }, a.isNew ? '계정 추가' : a.name + ' 설정'),
    h('div', { class: 'row two' }, h('div', {}, h('label', {}, '이름'), name), h('div', {}, h('label', {}, '쓰레드 아이디 (@ 없이)'), user)),
    h('label', {}, h('span', {}, enabled, ' 자동 업로드 사용')),
    h('div', { class: 'guide' }, h('b', {}, '이 계정의 쓰레드 토큰 등록'), h('br'),
      '1. Meta 개발자 화면에서 이 계정을 Threads 테스터로 추가하고 초대를 수락한 뒤 액세스 토큰을 만들어요.', h('br'),
      '2. ', h('a', { href: `https://github.com/${OWNER}/${REPO}/settings/secrets/actions/new`, target: '_blank', rel: 'noopener' }, 'GitHub 시크릿 등록 화면'), '에서 Name에 ', secretCode, ' 를 넣고 Secret에 토큰을 붙여넣어요.', h('br'),
      '토큰은 60일마다 새로 발급해 같은 이름으로 다시 등록해야 해요.'),
    h('label', {}, '말투·주제 설정'), persona,
    h('label', {}, '올리는 시간과 주제 방향'), slotsBox, h('div', { class: 'row' }, h('button', { onclick: () => addSlot({ time: '12:00', hint: '' }) }, '+ 시간 추가')),
    h('div', { class: 'row two' }, h('div', {}, h('label', {}, '링크 유도 시작일 (비우면 안 함)'), ctaStart), h('div', {})),
    h('label', {}, '링크 유도 방법'), ctaHint,
    h('div', { class: 'row' }, h('button', { class: 'primary', onclick: save }, '저장'), h('button', { onclick: () => { S.editing = null; render(); } }, '취소'), a.isNew ? null : h('button', { class: 'danger', onclick: remove }, '계정 지우기')));
}

if (S.token) act(async () => { try { await loadAll(); } catch (e) { if (e.status === 401) { S.token = ''; try { localStorage.removeItem('gh_token'); } catch (x) {} } throw e; } }); else render();
</script>
</body>
</html>
